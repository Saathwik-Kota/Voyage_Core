services:
  postgres:
    image: postgres:15-alpine
    container_name: voyage-postgres
    environment:
      POSTGRES_DB: travel_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - voyage-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: voyage-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_dbms_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - ./database/neo4j/init.cypher:/var/lib/neo4j/import/init.cypher
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - voyage-network
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER} -p ${NEO4J_PASSWORD} 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.15
    container_name: voyage-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    networks:
      - voyage-network

  jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: voyage-jaeger
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    networks:
      - voyage-network

  identity-manager:
    build:
      context: ./services/identity-manager
      dockerfile: Dockerfile
    container_name: voyage-identity-manager
    restart: on-failure
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/travel_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 24h
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: 6831
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
      jaeger:
        condition: service_started
    ports:
      - "3001:3001"
    networks:
      - voyage-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  profile-service:
    build:
      context: ./services/profile-service
      dockerfile: Dockerfile
    container_name: voyage-profile-service
    restart: on-failure
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/travel_db
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: 6831
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
      jaeger:
        condition: service_started
    ports:
      - "3002:3002"
    networks:
      - voyage-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  booking-engine:
    build:
      context: ./services/booking-engine
      dockerfile: Dockerfile
    container_name: voyage-booking-engine
    restart: on-failure
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/travel_db
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: 6831
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      vault:
        condition: service_started
      jaeger:
        condition: service_started
    ports:
      - "3003:3003"
    networks:
      - voyage-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  transaction-service:
    build:
      context: ./services/transaction-service
      dockerfile: Dockerfile
    container_name: voyage-transaction-service
    restart: on-failure
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/travel_db
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: 6831
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
      jaeger:
        condition: service_started
    ports:
      - "3004:3004"
    networks:
      - voyage-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: voyage-api-gateway
    restart: on-failure
    environment:
      NODE_ENV: production
      PORT: 3000
      IDENTITY_MANAGER_URL: http://identity-manager:3001
      PROFILE_SERVICE_URL: http://profile-service:3002
      BOOKING_ENGINE_URL: http://booking-engine:3003
      TRANSACTION_SERVICE_URL: http://transaction-service:3004
      AUTH_SERVICE_URL: http://identity-manager:3001
      USER_SERVICE_URL: http://profile-service:3002
      TRAVEL_SERVICE_URL: http://booking-engine:3003
      PAYMENT_SERVICE_URL: http://transaction-service:3004
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: 6831
    depends_on:
      - identity-manager
      - profile-service
      - booking-engine
      - transaction-service
    ports:
      - "3000:3000"
    networks:
      - voyage-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: voyage-admin-dashboard
    restart: on-failure
    environment:
      REACT_APP_API_URL: http://localhost:3000
    depends_on:
      - api-gateway
    ports:
      - "3005:80"
    networks:
      - voyage-network

  nginx:
    image: nginx:alpine
    container_name: voyage-nginx
    restart: on-failure
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-gateway
      - admin-dashboard
    networks:
      - voyage-network

volumes:
  postgres_data:
  neo4j_data:

networks:
  voyage-network:
    driver: bridge
