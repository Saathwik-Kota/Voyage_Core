apiVersion: v1
kind: Namespace
metadata:
  name: voyage-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: voyage-config
  namespace: voyage-system
data:
  POSTGRES_DB: travel_db
  NEO4J_USER: neo4j
---
apiVersion: v1
kind: Secret
metadata:
  name: voyage-secrets
  namespace: voyage-system
type: Opaque
stringData:
  POSTGRES_USER: travel_admin
  POSTGRES_PASSWORD: change_me_in_production
  NEO4J_PASSWORD: change_me_in_production
  JWT_SECRET: your_jwt_secret_key_change_in_production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: voyage-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: voyage-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: voyage-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: voyage-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: voyage-system
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-manager
  namespace: voyage-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-manager
  template:
    metadata:
      labels:
        app: identity-manager
    spec:
      containers:
      - name: identity-manager
        image: voyage-identity-manager:latest
        ports:
        - containerPort: 3001
        env:
        - name: DATABASE_URL
          value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: voyage-secrets
              key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: identity-manager
  namespace: voyage-system
spec:
  selector:
    app: identity-manager
  ports:
  - port: 3001
    targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-service
  namespace: voyage-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: profile-service
  template:
    metadata:
      labels:
        app: profile-service
    spec:
      containers:
      - name: profile-service
        image: voyage-profile-service:latest
        ports:
        - containerPort: 3002
        env:
        - name: DATABASE_URL
          value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
---
apiVersion: v1
kind: Service
metadata:
  name: profile-service
  namespace: voyage-system
spec:
  selector:
    app: profile-service
  ports:
  - port: 3002
    targetPort: 3002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-engine
  namespace: voyage-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-engine
  template:
    metadata:
      labels:
        app: booking-engine
    spec:
      containers:
      - name: booking-engine
        image: voyage-booking-engine:latest
        ports:
        - containerPort: 3003
        env:
        - name: DATABASE_URL
          value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
        - name: NEO4J_URI
          value: bolt://neo4j:7687
---
apiVersion: v1
kind: Service
metadata:
  name: booking-engine
  namespace: voyage-system
spec:
  selector:
    app: booking-engine
  ports:
  - port: 3003
    targetPort: 3003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: voyage-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
      - name: transaction-service
        image: voyage-transaction-service:latest
        ports:
        - containerPort: 3004
        env:
        - name: DATABASE_URL
          value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: voyage-system
spec:
  selector:
    app: transaction-service
  ports:
  - port: 3004
    targetPort: 3004
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: voyage-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: voyage-api-gateway:latest
        ports:
        - containerPort: 3000
        env:
        - name: IDENTITY_MANAGER_URL
          value: http://identity-manager:3001
        - name: PROFILE_SERVICE_URL
          value: http://profile-service:3002
        - name: BOOKING_ENGINE_URL
          value: http://booking-engine:3003
        - name: TRANSACTION_SERVICE_URL
          value: http://transaction-service:3004
        - name: AUTH_SERVICE_URL
          value: http://identity-manager:3001
        - name: USER_SERVICE_URL
          value: http://profile-service:3002
        - name: TRAVEL_SERVICE_URL
          value: http://booking-engine:3003
        - name: PAYMENT_SERVICE_URL
          value: http://transaction-service:3004
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: voyage-system
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 3000
